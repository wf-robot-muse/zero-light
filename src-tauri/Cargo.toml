[package]
name = "fishing-hunting-predictor"
version = "0.1.0"
description = "Fishing and Hunting Predictor - best times to hunt and fish by location"
authors = ["WF-Robot Muse"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This is the recommended default for Tauri 2 projects.
name = "fishing_hunting_predictor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
