name: Deploy cache Worker

# Manual only (item #15, Layer 2). Requires repo secrets
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, and the D1 database id
# filled into worker/wrangler.toml (see that file for one-time setup).
# Without the secrets this job reports the missing setup and exits
# cleanly instead of failing.

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy zero-light-cache Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check prerequisites
        id: prereq
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are not set — skipping Worker deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -q "REPLACE_WITH_D1_DATABASE_ID" worker/wrangler.toml; then
            echo "::notice::worker/wrangler.toml still has the placeholder D1 database id — skipping Worker deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Deploy with Wrangler
        if: steps.prereq.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
