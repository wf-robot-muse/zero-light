name: Deploy cache Worker

# Manual only (items #15/#20, Layer 2). The "Deploy cache Worker"
# workflow provisions everything itself:
#   1. Creates the D1 database `zero-light-cache` if it doesn't exist
#      and writes its id into worker/wrangler.toml for this run.
#   2. Applies worker/schema.sql (idempotent).
#   3. Deploys the Worker.
#   4. Sets Worker secrets from repo secrets: GEOAPIFY_API_KEY,
#      USGS_API_KEY, NCEI_CDO_TOKEN (each skipped with a notice when
#      the repo secret is unset); generates PURGE_SECRET once.
# Requires repo secrets CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID;
# without them the job reports the missing setup and exits cleanly.

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy zero-light-cache Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check prerequisites
        id: prereq
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are not set — skipping Worker deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Provision D1, deploy Worker, set secrets
        if: steps.prereq.outputs.ready == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEOAPIFY_API_KEY: ${{ secrets.GEOAPIFY_API_KEY }}
          USGS_API_KEY: ${{ secrets.USGS_API_KEY }}
          NCEI_CDO_TOKEN: ${{ secrets.NCEI_CDO_TOKEN }}
        run: |
          set -euo pipefail
          WR="npx -y wrangler@3"

          DB_ID=$($WR d1 list --json | python3 -c "import json,sys; dbs=json.load(sys.stdin); print(next((d['uuid'] for d in dbs if d['name']=='zero-light-cache'), ''))")
          if [ -z "$DB_ID" ]; then
            echo "Creating D1 database zero-light-cache…"
            $WR d1 create zero-light-cache
            DB_ID=$($WR d1 list --json | python3 -c "import json,sys; dbs=json.load(sys.stdin); print(next((d['uuid'] for d in dbs if d['name']=='zero-light-cache'), ''))")
          fi
          if [ -z "$DB_ID" ]; then
            echo "::error::Could not resolve the D1 database id."
            exit 1
          fi
          echo "D1 database id resolved."
          sed -i -E "s/^database_id = .*/database_id = \"$DB_ID\"/" wrangler.toml

          $WR d1 execute zero-light-cache --remote --file=schema.sql

          $WR deploy 2>&1 | tee deploy-output.txt
          WORKER_URL=$(grep -oE "https://[a-zA-Z0-9.-]+\.workers\.dev" deploy-output.txt | head -1 || true)
          {
            echo "### Zero Light cache Worker deployed"
            echo ""
            echo "Worker URL: ${WORKER_URL:-unknown — see deploy log}"
            echo "D1 database id: $DB_ID"
          } >> "$GITHUB_STEP_SUMMARY"

          put_secret() {
            if [ -n "$2" ]; then
              printf '%s' "$2" | $WR secret put "$1" > /dev/null
              echo "Worker secret $1 set from repo secret."
            else
              echo "::notice::Repo secret for $1 is not set — Worker secret skipped."
            fi
          }
          put_secret GEOAPIFY_API_KEY "$GEOAPIFY_API_KEY"
          put_secret USGS_API_KEY "$USGS_API_KEY"
          put_secret NCEI_CDO_TOKEN "$NCEI_CDO_TOKEN"

          if $WR secret list | grep -q "PURGE_SECRET"; then
            echo "Worker secret PURGE_SECRET already set — keeping it."
          else
            PURGE_VALUE=$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')
            printf '%s' "$PURGE_VALUE" | $WR secret put PURGE_SECRET > /dev/null
            echo "Worker secret PURGE_SECRET generated."
          fi
