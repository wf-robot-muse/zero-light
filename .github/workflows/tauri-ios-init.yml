# ONE-TIME scaffolding workflow (item #62): generates src-tauri/gen/apple
# by running `tauri ios init` on a macOS runner (the command exists only
# on macOS), then commits the result to the branch `ios-scaffold`.
# Delete this workflow after gen/apple has been merged to main.
name: Tauri iOS init (one-time)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  init:
    name: Generate gen/apple
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust (iOS targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios

      - name: Install frontend dependencies
        run: npm ci

      - name: Run tauri ios init
        run: npx tauri ios init --ci
        env:
          CI: "true"

      - name: Commit gen/apple to branch ios-scaffold
        run: |
          git config user.name "WF-Robot Muse"
          git config user.email "wf.robot.muse@gmail.com"
          git checkout -B ios-scaffold
          git add src-tauri/gen/apple
          git status --short
          git commit -m "Item #62: scaffold gen/apple via tauri ios init (one-time CI generation)"
          git push -f origin ios-scaffold
