# Item #62: Android build (Linux runner, per the #54 rule that mobile
# builds live in their own workflow files). Produces a signed release APK
# (universal, all ABIs) for sideloading to Fire OS / Android devices.
# Signing material comes from repo secrets; without them the job builds
# an unsigned APK and says so (useful as a compile check on forks).
name: Tauri Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Android APK (signed release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # packages is pinned because the action's default list includes
      # the old "tools" package, which Google no longer publishes —
      # the first #62 run failed in this step on exactly that. The
      # platform and build-tools are installed explicitly below.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install SDK platform 35 and build-tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up NDK r27c
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          link-to-sdk: true

      - name: Set up Rust (Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Write signing config from secrets (if present)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > src-tauri/gen/android/app/zero-light-upload.jks
            cat > src-tauri/gen/android/app/keystore.properties << EOF
          storeFile=zero-light-upload.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
            echo "Signing config written."
          else
            echo "No keystore secrets set; the release APK will be unsigned."
          fi

      # ANDROID_HOME is deliberately NOT set here: setup-android
      # exports it for later steps, and runs #2/#3 failed because this
      # step overrode it with the NDK action's (empty) sdk-path
      # output. Only NDK_HOME needs pinning, from the NDK step.
      - name: Build Android release APK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "NDK_HOME=$NDK_HOME"
          npx tauri android build --apk
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tauri-android
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
          if-no-files-found: error
