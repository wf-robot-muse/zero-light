# Item #62: iOS unsigned compile check (macos-15, per the #54 rule
# that platform builds live in their own workflow files).
#
# Scope (decision D4): free-tier testing only. CI cannot hold Wade's
# Personal Team signing, so this job proves the iOS code compiles and
# links for a real device target with signing switched off. The
# signed install build happens in Xcode on Wade's iMac, where he
# selects his Personal Team (see the setup manual, Part 9).
name: Tauri iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: iOS unsigned compile check
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust (iOS targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # The build must go through the Tauri CLI, not raw xcodebuild:
      # the generated project's Rust build phase calls
      # `tauri ios xcode-script`, which reads a CLI options file that
      # only exists while the CLI itself is driving the build (the
      # first #62 run failed on exactly that). --no-sign (CLI 2.11+)
      # produces an unsigned archive purely as a compile+link check;
      # the CLI also runs the frontend build itself.
      - name: Compile for iOS (unsigned)
        run: npx tauri ios build --no-sign --target aarch64
