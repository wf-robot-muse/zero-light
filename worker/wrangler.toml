# Zero Light shared cache Worker (item #15, Layer 2).
# Setup (once, by the account owner):
#   1. npx wrangler d1 create zero-light-cache   → paste the id below
#   2. npx wrangler d1 execute zero-light-cache --file=worker/schema.sql
#   3. npx wrangler secret put PURGE_SECRET
#   4. Deploy via the "Deploy cache Worker" GitHub Actions workflow
#      (needs repo secrets CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID)
#      or locally: npx wrangler deploy --config worker/wrangler.toml

name = "zero-light-cache"
main = "worker.js"
compatibility_date = "2025-01-01"

[[d1_databases]]
binding = "CACHE"
database_name = "zero-light-cache"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[triggers]
crons = ["17 * * * *"]
