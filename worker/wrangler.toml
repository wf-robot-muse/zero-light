# Zero Light shared cache Worker (items #15/#20, Layer 2).
# Setup is automated by the "Deploy cache Worker" GitHub Actions
# workflow (.github/workflows/deploy-worker.yml): it creates the D1
# database if needed, substitutes the real database_id for the
# placeholder below at deploy time, applies schema.sql, deploys, and
# sets the Worker secrets (GEOAPIFY_API_KEY, USGS_API_KEY,
# NCEI_CDO_TOKEN, PURGE_SECRET) from repo secrets.

name = "zero-light-cache"
main = "worker.js"
compatibility_date = "2025-01-01"

[[d1_databases]]
binding = "CACHE"
database_name = "zero-light-cache"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[triggers]
crons = ["17 * * * *"]
